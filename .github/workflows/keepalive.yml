name: Keep WhatsApp Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping WhatsApp Backend
        run: |
          curl -s https://nodejs-production-5edf4.up.railway.app/health || echo "Ping failed"
          curl -s https://nodejs-production-5edf4.up.railway.app/api/status || echo "Status failed"
